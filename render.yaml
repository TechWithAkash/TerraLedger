services:
  - type: web
    name: terraledger-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: terraledger-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: terraledger-db
    plan: free
    region: oregon
    databaseName: darukaa
    user: darukaa_user
